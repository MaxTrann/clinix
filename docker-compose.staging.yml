# Môi trường STAGING trên server: kéo image đã build sẵn từ GHCR (do workflow CD đẩy lên).
# Biến cần có trên server (file .env cạnh file này): GHCR_OWNER, TAG, các biến DB/JWT như .env.example.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER}/clinix-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Không publish cổng: mọi truy cập đi qua nginx của `web`. Gọi thẳng API sẽ giả được X-Forwarded-For vì trust proxy = 1.

  web:
    image: ghcr.io/${GHCR_OWNER}/clinix-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  db-data:
