server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Web và API cùng origin (Q2). `^~` là bắt buộc: thiếu nó thì regex file tĩnh bên dưới nuốt các đường như /api/x.png.
  # Không dùng error_page hay proxy_intercept_errors ở đây: FE cần nguyên thân JSON của API (TRACKING auth mục 5 điểm 13).
  location ^~ /api/ {
    # DNS của Docker. Đích nằm trong biến nên nginx phân giải lúc chạy: khởi động được khi chưa có `api`,
    # và không giữ IP cũ khi container api được tạo lại.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    # API không có tiền tố /api nên phải gỡ
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Phải lớn hơn LONG_TIMEOUT_MS (45 giây) của client, nếu không nginx trả 504 trước khi client kịp quyết định
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # Upload ảnh tối đa 10 MB, cộng phần dư của multipart
    client_max_body_size 11m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
