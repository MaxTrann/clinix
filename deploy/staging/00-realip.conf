# nginx của `web` đứng sau Caddy: lấy lại IP thật của khách từ X-Forwarded-For (chỉ tin mạng nội bộ của Docker),
# để API (trust proxy = 1) giới hạn OTP và khoá đăng nhập đúng theo từng người, không gộp mọi người vào IP của Caddy.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
