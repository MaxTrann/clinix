name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Phát hiện app đã được khởi tạo chưa. (hashFiles() không dùng được ở `if` cấp job nên phải làm qua job riêng.)
  detect:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        run: |
          if [ -f apps/api/package.json ]; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f apps/web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  # Chặng 1 — chuẩn commit/PR (squash merge dùng tiêu đề PR làm commit message)
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Chặng 2 — quét secret trên toàn bộ lịch sử (rubric TC2.4: 0 secret)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Nếu repo thuộc một GitHub Organization, cần thêm secret GITLEAKS_LICENSE.

  # Chặng 3 — lint + build + test + coverage cho API (chỉ chạy khi apps/api đã tồn tại)
  # Có MySQL 8.4 thật để chạy test tích hợp và e2e. Mật khẩu root bên dưới chỉ dùng cho container tạm của job này,
  # không phải bí mật; test tự tạo/xóa các DB tên *_test nên không đụng dữ liệu nào khác.
  api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only-throwaway-db
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-throwaway-db
          # Giống docker-compose: container DB chạy giờ Việt Nam, còn runner chạy UTC để test múi giờ có ý nghĩa
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run test:int -- --coverage
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore

  # Chặng 3 — tương tự cho Web
  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage --run
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  # Chặng 4 — mã trùng lặp ≤ 3% (rubric TC2.4 Mức 5)
  duplication:
    needs: detect
    if: needs.detect.outputs.api == 'true' || needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes jscpd@4 --config .jscpd.json

  # Chặng 5 — quét phụ thuộc & file hệ thống (rubric TC2.6: quét bảo mật/phụ thuộc)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Chặng 6 — build image Docker (chưa push) để bắt lỗi Dockerfile sớm
  docker:
    needs: [detect, api, web]
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: prod
          push: false
          build-args: VITE_API_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
