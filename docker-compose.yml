# Môi trường DEV: `docker compose up` chạy MySQL + API + Web với hot reload.
# Cần: đã sao chép .env.example -> .env, và đã khởi tạo apps/api, apps/web (xem docs/REPO_SETUP.md).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Giờ Việt Nam cho container DB (Q43 plan admin); API đặt thêm `SET time_zone` cho từng kết nối
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    env_file: .env
    # `environment` đè `env_file`: .env cũ còn VITE_API_URL=http://localhost:3000 cũng không phá cùng origin.
    # Trong container, API là service `api`, không phải localhost.
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  # Tunnel HTTPS cho IPN của VNPAY (payment X4; PLAN payment 4.7 #3), dùng dev domain cố định của tài khoản ngrok miễn phí nên URL IPN
  # chỉ khai trên VNPAY một lần. Có profile nên mặc định KHÔNG bật; máy nào đặt `COMPOSE_PROFILES=tunnel` ở .env cục bộ thì `docker compose up`
  # bật kèm (PLAN payment 4.7 #3, sửa 22/11/2026: được bật cùng api VỚI ĐIỀU KIỆN luôn có policy dưới). Xem docs/DEV_SETUP.md mục 5.3.
  # Trỏ thẳng `api:3000` (không qua Vite: Vite trả 403 với Host lạ), nên URL IPN không có tiền tố /api.
  # Traffic Policy chỉ cho `GET /payment/ipn/vnpay` đi qua, mọi đường khác 404: không mở cả API khi throttling theo IP chưa làm.
  # Không dùng `env_file: .env`: container này chỉ cần token và URL, không được thấy khoá VNPAY, mật khẩu DB.
  tunnel:
    image: ngrok/ngrok:3.39.13-alpine
    profiles: ["tunnel"]
    command: http api:3000 --url ${NGROK_URL:-} --traffic-policy-file /etc/ngrok/ipn-only.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./docker/ngrok/ipn-only.yml:/etc/ngrok/ipn-only.yml:ro
    depends_on:
      - api

volumes:
  db-data:
